<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bennett Home and Outdoor</title>
    <style>
        /* Modern reset for fluid layouts */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0056b8; color: white; font-family: sans-serif; overflow-x: hidden; }
        
        .nav-container { display: flex; justify-content: space-between; align-items: center; padding: 20px; width: 100%; max-width: 1200px; margin: 0 auto; }
        .logo-link { width: 100%; max-width: 250px; }
        .logo-img { width: 100%; height: auto; }
        
        .services-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
            width: 90%; /* Fluid width */
            max-width: 1200px; 
            margin: 40px auto; 
        }
        
        .card { background: white; color: #333; padding: 20px; border-radius: 12px; border: 4px solid #00cc00; text-decoration: none; display: flex; flex-direction: column; }
        /* ... rest of your styles ... */
    </style>
</head>
<body>
    </body>
</html>
